<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EduHisob — o‘quv markazi</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body data-today="{{ today }}"><aside><a class="brand" href="#home"><span class="logo">E</span> EduHisob</a><p class="muted">O‘quv markazi boshqaruvi</p><nav aria-label="Asosiy menyu"><a href="#home">◈ Bosh sahifa</a><a href="#debtors">◎ Qarzdorlar</a><a href="#students">▤ O‘quvchilar</a><a href="#payment">＋ To‘lov qo‘shish</a></nav><div class="aside-bottom">ECOMDEV · TO‘LOVLAR HISOBI<br><a href="/docs">API hujjatlari ↗</a></div></aside>
<main><header><div><span class="eyebrow">O‘QUV MARKAZI / MOLIYA</span><h1 id="title">Bosh sahifa</h1></div><label class="month-label">Hisobot oyi<input type="month" id="month" value="{{ today[:7] }}" min="0001-01" max="9999-11" required></label></header><div id="notice" role="status" aria-live="polite"></div><div id="content"></div><footer>EduHisob <span>Hisoblar aniq. Boshqaruv oson.</span></footer></main>
<dialog id="student-dialog"><form id="student-form" novalidate><div class="section-head"><h2 id="student-form-title">O‘quvchi qo‘shish</h2><button type="button" id="close-dialog" aria-label="Yopish">✕</button></div><input type="hidden" name="id"><label>Ism<input name="name" maxlength="200" required><small data-error="name"></small></label><label>Telefon<input name="phone" type="tel" maxlength="50" required><small data-error="phone"></small></label><label>Guruh<input name="group_name" maxlength="100" required><small data-error="group_name"></small></label><label>Oylik to‘lov (so‘m)<input name="monthly_fee" inputmode="decimal" required placeholder="350000.00"><small data-error="monthly_fee"></small></label><p class="form-error" role="alert"></p><button class="primary" type="submit">Saqlash</button></form></dialog>
<noscript>Saytdan foydalanish uchun JavaScript’ni yoqing.</noscript></body></html>
